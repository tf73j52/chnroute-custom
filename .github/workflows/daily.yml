name: daily-build

on:
  schedule:
    - cron: '0 16 * * *'
  workflow_dispatch:
    inputs:
      skip_if_unchanged:
        description: '上游无变化时跳过'
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ['ips.txt', 'domains.txt', 'exclude.txt', 'build.py']

concurrency:
  group: daily-build
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: 生成规则
        run: python3 build.py
        env:
          SKIP_IF_UNCHANGED: ${{ github.event_name == 'schedule' || github.event.inputs.skip_if_unchanged == 'true' }}

      - name: 提交变更
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "无变化，跳过提交"
          else
            git commit -m "chore: daily update $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase origin main
            git push
          fi

      - name: 刷新缓存
        run: |
          for f in cn.rsc gfwlist.rsc VERSION.txt; do
            curl -s -m 30 "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@main/$f" || true
          done
